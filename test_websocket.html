<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background: #f5f5f5;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        .user { background: #e3f2fd; }
        .assistant { background: #f1f8e9; }
        .error { background: #ffebee; color: #c62828; }
        input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>WebSocket RAG Test</h1>
    <div id="messages"></div>
    <input type="text" id="question" placeholder="Ask a question..." />
    <button onclick="sendQuestion()">Send</button>
    <button onclick="clearMessages()">Clear</button>

    <script>
        let ws = null;
        const messagesDiv = document.getElementById('messages');
        const questionInput = document.getElementById('question');

        function addMessage(content, type = 'assistant') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = content;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            addMessage(question, 'user');
            questionInput.value = '';

            // Close existing connection
            if (ws) {
                ws.close();
            }

            // Create new WebSocket connection
            ws = new WebSocket('ws://localhost:8000/api/v1/query/stream');
            let currentAnswer = '';
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                addMessage('🔌 Connected to server', 'info');
                
                const request = {
                    question: question,
                    session_id: 'test_session_123',
                    include_sources: true,
                    top_k: 5
                };
                
                ws.send(JSON.stringify(request));
                console.log('Sent request:', request);
            };

            ws.onmessage = (event) => {
                console.log('Received message:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    console.log('Parsed data:', data);
                    
                    if (data.type === 'start') {
                        addMessage('🤖 Generating response...', 'info');
                    } else if (data.type === 'chunk') {
                        currentAnswer += data.content;
                        // Update last message or create new one
                        const lastMsg = messagesDiv.lastElementChild;
                        if (lastMsg && lastMsg.classList.contains('assistant') && !lastMsg.dataset.complete) {
                            lastMsg.textContent = currentAnswer;
                        } else {
                            const div = document.createElement('div');
                            div.className = 'message assistant';
                            div.textContent = currentAnswer;
                            messagesDiv.appendChild(div);
                        }
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    } else if (data.type === 'sources') {
                        const lastMsg = messagesDiv.lastElementChild;
                        if (lastMsg) lastMsg.dataset.complete = 'true';
                        addMessage(`📚 Sources: ${data.sources.length} documents found`, 'info');
                        console.log('Sources:', data.sources);
                    } else if (data.type === 'done') {
                        addMessage('✅ Response complete', 'info');
                        currentAnswer = '';
                    } else if (data.type === 'error') {
                        addMessage(`❌ Error: ${data.message}`, 'error');
                    }
                } catch (error) {
                    console.error('Failed to parse message:', error);
                    addMessage(`Parse error: ${error.message}`, 'error');
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage('❌ Connection error', 'error');
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                addMessage('🔌 Disconnected', 'info');
            };
        }

        function clearMessages() {
            messagesDiv.innerHTML = '';
        }

        // Allow Enter key to send
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendQuestion();
            }
        });
    </script>
</body>
</html>
